<!doctype html>
<html lang="bg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LabCoin 2027 концепции</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e4e1da;--tag:#eef6f3;--tagink:#17705f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151517;--card:#1f1f22;--ink:#f1f0ec;--mute:#a3a3a8;--line:#2e2e33;--tag:#1d322d;--tagink:#7fdcc4}}
:root[data-theme="dark"]{--bg:#151517;--card:#1f1f22;--ink:#f1f0ec;--mute:#a3a3a8;--line:#2e2e33;--tag:#1d322d;--tagink:#7fdcc4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1240px;margin:0 auto;padding:32px 16px 64px}
header h1{font-size:30px;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--mute);max-width:720px}
h2{font-size:17px;margin:40px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{background:radial-gradient(circle at 50% 40%,#ffffff 0,#ebe8e2 75%);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .img{background:radial-gradient(circle at 50% 40%,#3a3a40 0,#232327 75%)}}
:root[data-theme="dark"] .img{background:radial-gradient(circle at 50% 40%,#3a3a40 0,#232327 75%)}
.img img{width:92%;height:92%;object-fit:contain}
figcaption{padding:12px 14px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font:600 13px/1 ui-monospace,Menlo,monospace;color:var(--mute)}
.tag{font-size:12px;background:var(--tag);color:var(--tagink);padding:3px 8px;border-radius:99px;white-space:nowrap}
h3{font-size:16px;margin:8px 0 4px}
figcaption p{margin:0;color:var(--mute);font-size:13.5px}
</style></head><body><main>
<header><h1>LabCoin 2027 — 37 концепции</h1>
<p>Шестоъгълна монета с плосък връх, като 2026. Всичко е векторно (SVG) и генерирано от <code>build.py</code>,
така че размерите и дебелините лесно се сменят. Цветовете са примерни филаменти.</p></header>
<h2>A · LAB запълва монетата</h2><div class="grid">
<figure class="card"><div class="img"><img src="svg/01-hexband.svg" alt="LAB по ръба" loading="lazy"></div><figcaption><div class="row"><span class="num">01</span><span class="tag">Изваждаща се плочка</span></div><h3>LAB по ръба</h3><p>L, A и B са „изрязани“ от самия шестоъгълник: L се огъва по левите ръбове, B – по десните, A стои в средата. Под чертата на A има процеп до долния ръб, в който влиза отделна плочка COIN.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/02-openwork.svg" alt="Ажурна LAB" loading="lazy"></div><figcaption><div class="row"><span class="num">02</span><span class="tag">Ажур / ключодържател</span></div><h3>Ажурна LAB</h3><p>Същите букви по ръба, но всичко между тях е изрязано – монетата е само рамка от L, A и B. Долу в средата е отворена, а COIN и 2027 са гравирани върху чертите на A.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/03-stencil.svg" alt="Шаблон" loading="lazy"></div><figcaption><div class="row"><span class="num">03</span><span class="tag">Шаблон за рисуване</span></div><h3>Шаблон</h3><p>LAB е прорязано през монетата като шаблон (стенсил) – с мостчета, за да не падат вътрешностите. С нея може буквално да се рисува LAB с флумастер.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/04-lower-hex.svg" alt="lab с шестоъгълни купи" loading="lazy"></div><figcaption><div class="row"><span class="num">04</span><span class="tag">Релеф</span></div><h3>lab с шестоъгълни купи</h3><p>Малки букви, при които „купите“ на a и b са шестоъгълници – същата форма като монетата. По-мек, приятелски вид.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/05-italic-bleed.svg" alt="LAB извън ръба" loading="lazy"></div><figcaption><div class="row"><span class="num">05</span><span class="tag">Двуцветен печат</span></div><h3>LAB извън ръба</h3><p>Огромни наклонени букви, които „излизат“ от монетата – ръбът ги реже. Двуцветен печат: буквите са бели, тялото червено.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/06-ligature.svg" alt="Лигатура LAB" loading="lazy"></div><figcaption><div class="row"><span class="num">06</span><span class="tag">Релеф / лого</span></div><h3>Лигатура LAB</h3><p>Трите букви споделят черти: стъпалото на L влиза в крака на A, а десният крак на A е гръбнакът на B. Една фигура вместо три букви – лого.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/07-neon.svg" alt="Неон" loading="lazy"></div><figcaption><div class="row"><span class="num">07</span><span class="tag">Светеща нишка</span></div><h3>Неон</h3><p>Буквите са само контури – като неонови тръби върху тъмна основа. Отпечатва се с прозрачна/светеща нишка за контурите.</p></figcaption></figure>
</div>
<h2>B · Пъзели от парчета</h2><div class="grid">
<figure class="card"><div class="img"><img src="svg/08-iso-cube.svg" alt="Изометричен куб" loading="lazy"></div><figcaption><div class="row"><span class="num">08</span><span class="tag">Пъзел, 3 части</span></div><h3>Изометричен куб</h3><p>Шестоъгълникът е разделен на три ромба – окото го вижда като куб. Всяка стена е отделно парче с една буква. Сглобява се като пъзел от 3 части.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/09-seven.svg" alt="Седем букви" loading="lazy"></div><figcaption><div class="row"><span class="num">09</span><span class="tag">Пъзел, 7 части</span></div><h3>Седем букви</h3><p>6 триъгълника + център = точно 7 парчета за L-A-B-C-O-I-N. Горе се чете LAB, долу C-O-I-N, а O е централният шестоъгълник с годината.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/10-jigsaw.svg" alt="Пъзел с шестоъгълни ключалки" loading="lazy"></div><figcaption><div class="row"><span class="num">10</span><span class="tag">Пъзел, 3 части</span></div><h3>Пъзел с шестоъгълни ключалки</h3><p>Три вертикални парчета (L | A | B), заключени едно в друго с шестоъгълни „уши“ като на пъзел. Парчетата се вадят и разменят.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/11-spinner.svg" alt="Спинър" loading="lazy"></div><figcaption><div class="row"><span class="num">11</span><span class="tag">Въртящ се център</span></div><h3>Спинър</h3><p>Три извити „перки“ с L, A и B около въртящ се център с COIN 2027. Центърът е на лагер (или топче), монетата се върти като фиджет спинър.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/12-slider.svg" alt="Плъзгащ пъзел" loading="lazy"></div><figcaption><div class="row"><span class="num">12</span><span class="tag">Плъзгащ пъзел</span></div><h3>Плъзгащ пъзел</h3><p>18 шестоъгълни плочки и едно празно място – като „15“, но в пчелна пита. Плочките се плъзгат, докато се подредят 2027 / LAB / COIN.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/13-bands.svg" alt="Плъзгащи ленти" loading="lazy"></div><figcaption><div class="row"><span class="num">13</span><span class="tag">Плъзгане / шифър</span></div><h3>Плъзгащи ленти</h3><p>Три хоризонтални ленти – 2027 / LAB / COIN. Средната се плъзга наляво-надясно като ключалка с шифър; монетата е „подредена“, когато ръбовете съвпаднат.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/14-dial.svg" alt="Шифър-диск" loading="lazy"></div><figcaption><div class="row"><span class="num">14</span><span class="tag">Въртящ се пръстен</span></div><h3>Шифър-диск</h3><p>Средният пръстен с L-A-B-C-O-I-N се върти в рамката. Стрелката горе показва коя буква е „избрана“, а в центъра е годината.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/15-glitch.svg" alt="Разместени диагонали" loading="lazy"></div><figcaption><div class="row"><span class="num">15</span><span class="tag">Плъзгащ пъзел</span></div><h3>Разместени диагонали</h3><p>Монетата е нарязана на три ивици под 60° (по ъгъла на шестоъгълника). Ивиците са разместени – целта е да ги плъзнеш обратно, докато LAB се подреди.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/16-inlay.svg" alt="Вадещи се букви" loading="lazy"></div><figcaption><div class="row"><span class="num">16</span><span class="tag">Вадещи се плочки</span></div><h3>Вадещи се букви</h3><p>L, A и B са отделни плочки, които „щракват“ в гнезда в монетата (като детски пъзел с форми). На картинката B е извадена.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/17-halves.svg" alt="Две половини" loading="lazy"></div><figcaption><div class="row"><span class="num">17</span><span class="tag">Пъзел, 2 части</span></div><h3>Две половини</h3><p>Монетата се разделя на две половини, захванати със зъби. Горе LAB, долу COIN и годината. Половинките могат да се раздадат на двама души.</p></figcaption></figure>
</div>
<h2>C · Текстури и техники</h2><div class="grid">
<figure class="card"><div class="img"><img src="svg/18-honeycomb.svg" alt="Пчелна пита" loading="lazy"></div><figcaption><div class="row"><span class="num">18</span><span class="tag">Релеф / текстура</span></div><h3>Пчелна пита</h3><p>LAB е „нарисувано“ с малки шестоъгълни пиксели. Всяка клетка е мини-копие на монетата.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/19-seg7.svg" alt="Дисплей" loading="lazy"></div><figcaption><div class="row"><span class="num">19</span><span class="tag">Двуцветен / светещ</span></div><h3>Дисплей</h3><p>Като дигитален часовник: буквите са от седемсегментни шестоъгълни сегменти. Незапалените сегменти са леко вдлъбнати, светещите – от прозрачна оранжева нишка.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/20-circuit.svg" alt="Платка" loading="lazy"></div><figcaption><div class="row"><span class="num">20</span><span class="tag">Двуцветен печат</span></div><h3>Платка</h3><p>LAB е разчертано като писти на електронна платка – с контактни площадки и отвори. Отпечатва се зелено + медна нишка.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/21-maze.svg" alt="Лабиринт" loading="lazy"></div><figcaption><div class="row"><span class="num">21</span><span class="tag">Лабиринт с топче</span></div><h3>Лабиринт</h3><p>Игра с топче: прокарай топчето от външния коридор през процепите до LAB в центъра. Отгоре се слага прозрачен капак.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/22-flask.svg" alt="Колба" loading="lazy"></div><figcaption><div class="row"><span class="num">22</span><span class="tag">Двуцветен печат</span></div><h3>Колба</h3><p>A е лабораторна колба (Ерленмайер), в която „кипи“ течност с шестоъгълни мехурчета. Нивото на течността е чертата на A.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/23-dots.svg" alt="Точкова матрица" loading="lazy"></div><figcaption><div class="row"><span class="num">23</span><span class="tag">Двуцветен / светещ</span></div><h3>Точкова матрица</h3><p>Като старо LED табло: всичко е от точки 5×7. Светещите точки са изпъкнали, а „изгасените“ – малки вдлъбнатини.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/24-extrude.svg" alt="3D букви" loading="lazy"></div><figcaption><div class="row"><span class="num">24</span><span class="tag">Релеф</span></div><h3>3D букви</h3><p>LAB е изтеглено в перспектива – буквите изглеждат като обемни блокчета, които „стоят“ върху монетата.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/25-stripes.svg" alt="Райета" loading="lazy"></div><figcaption><div class="row"><span class="num">25</span><span class="tag">Релеф / текстура</span></div><h3>Райета</h3><p>Оп-арт: фонът е на хоризонтални райета, буквите – на вертикални. Отблизо е шарка, отдалеч се чете LAB.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/26-topo.svg" alt="Топографска карта" loading="lazy"></div><figcaption><div class="row"><span class="num">26</span><span class="tag">Релеф / текстура</span></div><h3>Топографска карта</h3><p>Около буквите се разливат контурни линии като на карта с височини. Изглежда много добре при печат с фина дюза.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/27-sketch.svg" alt="Скицата, изчистена" loading="lazy"></div><figcaption><div class="row"><span class="num">27</span><span class="tag">Релеф + плочка</span></div><h3>Скицата, изчистена</h3><p>Най-близо до рисунката с молив: 2027 в удължен шестоъгълник горе, L като „&lt;“, A с шестоъгълен отвор и отделна трапецовидна плочка, B със заострени купи, COIN с шестоъгълно O.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/28-washer.svg" alt="Гайка" loading="lazy"></div><figcaption><div class="row"><span class="num">28</span><span class="tag">Отвор / ключодържател</span></div><h3>Гайка</h3><p>Монетата е като голяма гайка – с шестоъгълен отвор в средата (става и за ключодържател или нанизване на шнур). LAB горе, COIN долу, „болтове“ отстрани.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/29-longshadow.svg" alt="Дълга сянка" loading="lazy"></div><figcaption><div class="row"><span class="num">29</span><span class="tag">Релеф на 3 нива</span></div><h3>Дълга сянка</h3><p>Плосък дизайн: буквите хвърлят дълга сянка под 45° чак до ръба на монетата. Сянката е по-ниско ниво от релефа.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/30-cubes.svg" alt="Кубчета" loading="lazy"></div><figcaption><div class="row"><span class="num">30</span><span class="tag">Релеф / 3D илюзия</span></div><h3>Кубчета</h3><p>Всеки „пиксел“ на LAB е малко изометрично кубче. Трите стени са в три нюанса – получава се 3D ефект, макар релефът да е плосък.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/31-medal.svg" alt="Медал" loading="lazy"></div><figcaption><div class="row"><span class="num">31</span><span class="tag">Релеф</span></div><h3>Медал</h3><p>Широк ръб с надписи по всяка страна (LAB, 20, 27, COIN), а в средата – голямо 27 върху фон от малки шестоъгълници.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/32-twotone.svg" alt="Две половини, два цвята" loading="lazy"></div><figcaption><div class="row"><span class="num">32</span><span class="tag">Пъзел, 2 части</span></div><h3>Две половини, два цвята</h3><p>Монетата е срязана по диагонал на черна и бяла половина; надписите сменят цвета си точно на разреза. Две парчета, два филамента.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/33-rounded.svg" alt="lab coin, заоблени" loading="lazy"></div><figcaption><div class="row"><span class="num">33</span><span class="tag">Релеф</span></div><h3>lab coin, заоблени</h3><p>Малки букви със заоблени ъгли, подредени на два реда. Точката на i е шестоъгълник, а годината е в малка шестоъгълна значка.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/34-halftone.svg" alt="Перфорация" loading="lazy"></div><figcaption><div class="row"><span class="num">34</span><span class="tag">Отвори / сянка</span></div><h3>Перфорация</h3><p>Монетата е надупчена с кръгли отвори – по-големи в буквите и все по-малки навън, като полутонов печат. На светло LAB „свети“ през нея.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/35-totem.svg" alt="Тотем" loading="lazy"></div><figcaption><div class="row"><span class="num">35</span><span class="tag">Релеф</span></div><h3>Тотем</h3><p>LAB е подредено вертикално в канал по средата, а COIN и 2027 текат отстрани нагоре/надолу. Монетата може да виси на връзка.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/36-liquid.svg" alt="Мензура" loading="lazy"></div><figcaption><div class="row"><span class="num">36</span><span class="tag">Двуцветен печат</span></div><h3>Мензура</h3><p>Буквите са кухи „съдове“, наполовина пълни с течност с мехурчета – лабораторна тема. Течността е от светеща/прозрачна нишка.</p></figcaption></figure>
<figure class="card"><div class="img"><img src="svg/37-molecule.svg" alt="Молекула" loading="lazy"></div><figcaption><div class="row"><span class="num">37</span><span class="tag">Релеф / двуцветен</span></div><h3>Молекула</h3><p>LAB е нарисувано като химична формула: B е от два бензенови пръстена, A има пръстен вместо дупка, а COIN е „верига“ от атоми.</p></figcaption></figure>
</div>
</main></body></html>
